name: TrailPulse
options:
  bundleIdPrefix: com.diongusija
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  TrailPulse:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: TrailPulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diongusija.TrailPulse
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    scheme:
      testTargets: []
